name: Restaurant release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run test:ci
      - run: npm audit --omit=dev --audit-level=high --prefix backend
      - run: npm audit --omit=dev --audit-level=high --prefix frontend
